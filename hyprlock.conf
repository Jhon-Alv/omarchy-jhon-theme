# ==========================================================
# Jhon Theme - Hyprlock
# Minimal • Firewatch Inspired
# ==========================================================

$accent = rgba(74c7ecff)
$text = rgba(f5f7faff)
$subtext = rgba(c8d1daff)

$glass = rgba(10,15,25,0.30)
$glass_border = rgba(116,192,252,0.45)

general {
    hide_cursor = true
    no_fade_in = false
    grace = 0
    disable_loading = true
}

animations {
    enabled = true

    bezier = smooth,0.25,1,0.5,1

    animation = fadeIn,1,3,smooth
    animation = fadeOut,1,3,smooth
}

background {
    monitor =
    path = ~/.config/omarchy/current/theme/lockscreen.png

    blur_passes = 3
    blur_size = 4

    noise = 0.02
    contrast = 1.05
    brightness = 0.92
    vibrancy = 0.15
}

# ----------------------------------------------------------
# Avatar
# ----------------------------------------------------------

image {
    monitor =

    path = ~/.config/omarchy/current/theme/profile.png

    size = 180

    rounding = -1

    border_size = 3
    border_color = $accent

    position = 0,120

    halign = center
    valign = center
}

# ----------------------------------------------------------
# Time
# ----------------------------------------------------------

label {
    monitor =

    text = cmd[update:1000] echo "$(date +"%H:%M")"

    color = $text

    font_family = JetBrainsMono Nerd Font ExtraBold
    font_size = 62

    position = 0,-15

    halign = center
    valign = center
}

# ----------------------------------------------------------
# Date
# ----------------------------------------------------------

label {
    monitor =

    text = cmd[update:60000] echo "$(date +"%A, %B %d")"

    color = $subtext

    font_family = JetBrainsMono Nerd Font SemiBold
    font_size = 18

    position = 0,-72

    halign = center
    valign = center
}

# ----------------------------------------------------------
# Input Field
# ----------------------------------------------------------

input-field {
    monitor =

    size = 360,62

    position = 0,-165

    halign = center
    valign = center

    rounding = 18

    outline_thickness = 2

    inner_color = $glass
    outer_color = $glass_border

    font_family = JetBrainsMono Nerd Font
    font_color = $text

    placeholder_text = Password

    check_color = $accent
    fail_color = rgba(ff6b6bff)

    dots_center = true
    dots_spacing = 0.30
    dots_size = 0.22

    fade_on_empty = false
    shadow_passes = 3
    shadow_size = 8
}

auth {
    fingerprint:enabled = false
}
